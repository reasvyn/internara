services:
  app:
    build:
      context: '${GIT_URL:-https://github.com/reasvyn/internara.git#main}'
      dockerfile: Dockerfile
    image: internara-app
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?APP_KEY is required}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: internara
      DB_USERNAME: internara
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      SESSION_DRIVER: database
      BROADCAST_CONNECTION: log
      RUN_SCHEDULER: "true"
    volumes:
      - storage_data:/app/storage
      - app_data:/app/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/fpm-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: internara
      MYSQL_USER: internara
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "internara",
          "-p${DB_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: '${GIT_URL:-https://github.com/reasvyn/internara.git#main}'
      dockerfile: .docker/nginx.Dockerfile
    image: internara-web
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - app_data:/app/public:ro
      - storage_data:/app/storage:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  storage_data:
  app_data:
