services:
    app:
        # Build from the checkout that owns this compose file (override with BUILD_CONTEXT).
        build:
            context: '${BUILD_CONTEXT:-.}'
            dockerfile: Dockerfile
        image: internara-app
        environment:
            APP_ENV: '${APP_ENV:-production}'
            APP_URL: '${APP_URL:-https://internara.web.id}'
            APP_KEY: '${APP_KEY:?APP_KEY is required}'
            APP_LOCALE: '${APP_LOCALE:-id}'
            APP_FAKER_LOCALE: '${APP_FAKER_LOCALE:-id_ID}'
            APP_TIMEZONE: '${APP_TIMEZONE:-Asia/Jakarta}'
            DB_CONNECTION: sqlite
            DB_DATABASE: /app/storage/database.sqlite
            QUEUE_CONNECTION: sync
            CACHE_STORE: file
            SESSION_DRIVER: '${SESSION_DRIVER:-file}'
            SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:-true}'
            BROADCAST_CONNECTION: log
            RUN_SCHEDULER: '${RUN_SCHEDULER:-false}'
        volumes:
            - storage_data:/app/storage
            - app_data:/app/public
        healthcheck:
            test: ['CMD', '/usr/local/bin/fpm-healthcheck']
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 90s
        ports:
            - '127.0.0.1:9000:9000'
        restart: unless-stopped
        mem_limit: 384m
        cpus: 1.0

volumes:
    storage_data:
    app_data:
