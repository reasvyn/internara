services:
    app:
        build:
            context: '${GIT_URL:-https://github.com/reasvyn/internara.git#main}'
            dockerfile: Dockerfile
        ports:
            - '${APP_PORT:-9000}:9000'
        environment:
            APP_ENV: production
            APP_KEY: '${APP_KEY}'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: internara
            DB_USERNAME: internara
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            QUEUE_CONNECTION: redis
        volumes:
            - storage_data:/app/storage
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started

    queue:
        build:
            context: '${GIT_URL:-https://github.com/reasvyn/internara.git#main}'
            dockerfile: Dockerfile
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        environment:
            APP_ENV: production
            APP_KEY: '${APP_KEY}'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: internara
            DB_USERNAME: internara
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            QUEUE_CONNECTION: redis
        volumes:
            - storage_data:/app/storage
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started

    scheduler:
        build:
            context: '${GIT_URL:-https://github.com/reasvyn/internara.git#main}'
            dockerfile: Dockerfile
        command: php artisan schedule:work
        environment:
            APP_ENV: production
            APP_KEY: '${APP_KEY}'
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_DATABASE: internara
            DB_USERNAME: internara
            DB_PASSWORD: '${DB_PASSWORD}'
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8
        environment:
            MYSQL_DATABASE: internara
            MYSQL_USER: internara
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_RANDOM_ROOT_PASSWORD: yes
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            timeout: 5s
            retries: 5

    web:
        build:
            context: '${GIT_URL:-https://github.com/reasvyn/internara.git#main}'
            dockerfile: .docker/nginx.Dockerfile
        ports:
            - '${NGINX_PORT:-80}:80'
        volumes:
            - storage_data:/app/storage
        depends_on:
            - app

volumes:
    mysql_data:
    redis_data:
    storage_data:
