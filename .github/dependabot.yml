version: 2
updates:
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 5
      reviewers:
          - reasvyn
      commit-message:
          prefix: 'deps:'
          include: 'scope'

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 5
      reviewers:
          - reasvyn
      commit-message:
          prefix: 'deps:'
          include: 'scope'
