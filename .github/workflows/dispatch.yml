name: Dispatch deploy

on:
    push:
        branches: [docker-deploy]

permissions:
    contents: read

jobs:
    notify:
        name: Notify deploy repo
        runs-on: ubuntu-latest
        steps:
            - name: Send repository_dispatch
              env:
                  GITHUB_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
              run: |
                  curl -fsS -X POST \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/reasvyn/internara-deploy/dispatches" \
                      -d '{"event_type":"deploy"}'
