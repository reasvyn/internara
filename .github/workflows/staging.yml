name: Staging Deploy

# Secure automatic deploy for the staging branch — bypasses the
# SemVer tag pipeline directly to the staging area (https://staging.internara.web.id).
#
#   Trigger: push to staging (or manual dispatch)
#   Flow:    lint → deploy VPS (VERSION_TAG=staging, HEALTH_URL=https://staging.internara.web.id/up)
#
# Security:
#   - Minimal permissions (contents:read)
#   - Concurrency serialized (no parallel staging deploys)
#   - Deploys only from the staging branch (branch filter + ref check)
#   - SSH deploy uses pinned action, no secrets in logs, strict host
#   - ROLLBACK_ON_FAILURE=true in deploy.sh auto-rolls back on health failure

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & validate staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          echo "==> Validate PHP syntax"
          find app config database routes tests -name '*.php' -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true
          echo "✓ syntax ok"

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Build frontend assets
        run: npm run build
        env:
          NODE_ENV: production

  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/staging'
    env:
      VERSION_TAG: staging
      HEALTH_URL: https://staging.internara.web.id/up
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Verify staging ref
        run: |
          set -euo pipefail
          echo "Deploying ref: ${{ github.ref }} (${{ github.sha }})"
          [ "${{ github.ref }}" = "refs/heads/staging" ] || { echo "::error::Ref is not staging"; exit 1; }
          git log --oneline -3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: VERSION_TAG,HEALTH_URL
          request_pty: false
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "==> Staging deploy: ${VERSION_TAG} @ ${{ github.sha }}"
            cd "$HOME/apps/internara"
            # Ensure we are on staging and at the pushed commit
            git fetch --force origin staging
            git checkout --force staging
            # Reset to the exact commit GitHub just pushed
            git reset --hard "origin/staging"
            echo "==> Checked out $(git rev-parse --short HEAD) on $(git branch --show-current)"
            # Run deploy path targeting staging domain
            HEALTH_URL="$HEALTH_URL" VERSION_TAG="$VERSION_TAG" bash .github/scripts/deploy.sh
            echo "==> Staging deploy finished"

      - name: Notify success
        if: success()
        run: echo "✓ Staging ${{ github.sha }} deployed to https://staging.internara.web.id"

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed for ${{ github.sha }}"
          echo "Manual rollback: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd \$HOME/apps/internara && bash .github/scripts/rollback.sh'"
