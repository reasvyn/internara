name: Docker Cache Cleanup

on:
  schedule:
    # Sunday 03:30 UTC / 10:30 WIB, outside the normal release window.
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune stale Docker cache on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cleanup Docker cache via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          request_pty: false
          script: |
            set -euo pipefail
            cd "$HOME/apps/internara"
            bash .github/scripts/cleanup-docker-cache.sh
