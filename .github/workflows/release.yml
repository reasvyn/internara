name: Release Pipeline
# Comprehensive CI/CD orchestrator driven by SemVer tags. All QA stages run on
# GitHub Actions (free, no VPS load), and each stage calls a dedicated reusable
# script under .github/scripts/. Only the PRODUCTION stage deploys to the VPS.
#
#   Triggering tag        -> Stage          -> Scripts run
#   ----------------------------------------------------------------
#   v<X>.<Y>.<Z>-dev.<N>  -> development    validate + lint + frontend build
#   v<X>.<Y>.<Z>-beta.<N> -> testing/QA     validate + lint + test + frontend build + security audit
#   v<X>.<Y>.<Z>-rc.<N>   -> staging/RC     validate + lint + test + guards + build + smoke + security
#   v<X>.<Y>.<Z>          -> production     validate + all of the above, then deploy VPS
#
# Releases are promoted upward: development -> testing -> staging -> production.
# A final tag never deploys to the VPS unless every QA stage passes.
# Standard industry flow: development (dev) -> QA/testing (beta) ->
# pre-production (rc) -> production (final release).

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: read
    checks: write

# Avoid two parallel QA runs for the same tag (e.g. a re-pushed tag).
concurrency:
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

env:
    PHP_VERSION: '8.4'
    DB_CONNECTION: sqlite
    DB_DATABASE: ':memory:'

jobs:
    # ------------------------------------------------------------------ #
    # Stage detection — derive the stage from the pushed tag.
    # ------------------------------------------------------------------ #
    stage:
        name: Detect release stage
        runs-on: ubuntu-latest
        outputs:
            stage: ${{ steps.detect.outputs.stage }}
            version: ${{ steps.detect.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Detect stage from tag
              id: detect
              run: |
                  set -euo pipefail
                  TAG="${{ github.ref_name }}"
                  echo "Pushed tag: $TAG"
                  if echo "$TAG" | grep -qEe '-[a-zA-Z0-9]+\.[0-9]+$'; then
                    # Pre-release tag: <version>-<word>.<num>
                    SUFFIX="${TAG##*-}"
                    WORD="${SUFFIX%%.*}"
                    VERSION="${TAG%-*}"
                    case "$WORD" in
                      dev)    STAGE="dev" ;;
                      beta)   STAGE="testing" ;;
                      rc)     STAGE="staging" ;;
                      *)      STAGE="dev" ;; # alpha, pre, etc -> fallback to dev
                    esac
                  else
                    # Final tag: <version> without suffix
                    STAGE="production"
                    VERSION="$TAG"
                  fi
                  echo "stage=$STAGE"
                  echo "version=$VERSION"
                  echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Show stage & version
              run: |
                  echo "Detected stage: ${{ steps.detect.outputs.stage }}"
                  echo "Version: ${{ steps.detect.outputs.version }}"

    # ------------------------------------------------------------------ #
    # Version validation — ensure composer.json version matches the tag.
    # ------------------------------------------------------------------ #
    validate:
        name: Validate version consistency
        runs-on: ubuntu-latest
        needs: stage
        outputs:
            version: ${{ steps.validate.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Validate version matches tag
              id: validate
              run: |
                  set -euo pipefail
                  TAG="${{ needs.stage.outputs.version }}"
                  COMPOSER_VERSION=$(jq -r '.version' composer.json)
                  TAG_VERSION="${TAG#v}"

                  echo "Tag version: $TAG_VERSION"
                  echo "composer.json version: $COMPOSER_VERSION"

                  if [ "$TAG_VERSION" != "$COMPOSER_VERSION" ]; then
                    echo "::error::Version mismatch: tag is $TAG but composer.json is $COMPOSER_VERSION"
                    exit 1
                  fi

                  echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
                  echo "✓ Version validated: $COMPOSER_VERSION"

            - name: Validate PHP syntax
              run: |
                  echo "==> Validating PHP syntax"
                  find app config database routes tests -name '*.php' -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true
                  echo "✓ PHP syntax validated"

            - name: Validate composer.json/schema
              run: |
                  echo "==> Validating composer.json"
                  composer validate --strict
                  echo "✓ composer.json validated"

            - name: Validate npm dependencies
              run: |
                  echo "==> Checking npm audit"
                  npm audit --production --audit-level=high || true
                  echo "✓ npm audit completed"

    # ------------------------------------------------------------------ #
    # DEVELOPMENT stage — light QA (lint + frontend build) for -dev.* tags.
    # ------------------------------------------------------------------ #
    dev:
        name: DEV - lint & build
        runs-on: ubuntu-latest
        needs: [stage, validate]
        if: needs.stage.outputs.stage == 'dev'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite
                  coverage: none
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Cache npm dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-

            - name: Install frontend dependencies
              run: npm ci --legacy-peer-deps

            - name: Lint (Pint)
              run: bash .github/scripts/lint.sh

            - name: Build frontend assets
              run: npm run build
              env:
                  NODE_ENV: production

    # ------------------------------------------------------------------ #
    # TESTING / QA stage — full QA for -beta.* tags.
    # ------------------------------------------------------------------ #
    testing:
        name: TESTING/QA - full suite
        runs-on: ubuntu-latest
        needs: [stage, validate]
        if: needs.stage.outputs.stage == 'testing'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite
                  coverage: xdebug
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Cache npm dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-

            - name: Install frontend dependencies
              run: npm ci --legacy-peer-deps

            - name: Lint (Pint)
              run: bash .github/scripts/lint.sh

            - name: Test suite (coverage gate)
              run: bash .github/scripts/test.sh

            - name: Build frontend assets
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Composer security audit
              run: composer audit --format=json
              continue-on-error: true

    # ------------------------------------------------------------------ #
    # STAGING / RC stage — full QA + guards + smoke for -rc.* tags.
    # ------------------------------------------------------------------ #
    staging:
        name: STAGING/RC - full QA + guard
        runs-on: ubuntu-latest
        needs: [stage, validate]
        if: needs.stage.outputs.stage == 'staging'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite
                  coverage: xdebug
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Cache npm dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-

            - name: Install frontend dependencies
              run: npm ci --legacy-peer-deps

            - name: Lint (Pint)
              run: bash .github/scripts/lint.sh

            - name: Test suite (coverage gate)
              run: bash .github/scripts/test.sh

            - name: Architecture guards
              run: bash .github/scripts/guards.sh

            - name: Build frontend assets
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Smoke test (production build)
              run: bash .github/scripts/smoke.sh
              env:
                  DB_CONNECTION: sqlite
                  DB_DATABASE: database/database.sqlite

            - name: Composer security audit
              run: composer audit --format=json
              continue-on-error: true

            - name: Generate release notes preview
              run: bash .github/scripts/release-notes.sh "${{ needs.validate.outputs.version }}"

    # ------------------------------------------------------------------ #
    # PRODUCTION stage — full QA for FINAL tags, then the VPS deploy job.
    # ------------------------------------------------------------------ #
    production:
        name: PRODUCTION - full QA
        runs-on: ubuntu-latest
        needs: [stage, validate]
        if: needs.stage.outputs.stage == 'production'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite
                  coverage: xdebug
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Setup Environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Cache npm dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: ${{ runner.os }}-npm-

            - name: Install frontend dependencies
              run: npm ci --legacy-peer-deps

            - name: Lint (Pint)
              run: bash .github/scripts/lint.sh

            - name: Test suite (coverage gate)
              run: bash .github/scripts/test.sh

            - name: Architecture guards
              run: bash .github/scripts/guards.sh

            - name: Build frontend assets
              run: npm run build
              env:
                  NODE_ENV: production

            - name: Smoke test (production build)
              run: bash .github/scripts/smoke.sh
              env:
                  DB_CONNECTION: sqlite
                  DB_DATABASE: database/database.sqlite

            - name: Composer security audit
              run: composer audit --format=json
              continue-on-error: true

            - name: Generate release notes
              id: release-notes
              run: bash .github/scripts/release-notes.sh "${{ needs.validate.outputs.version }}"

            - name: Upload release notes artifact
              uses: actions/upload-artifact@v4
              with:
                  name: release-notes-${{ needs.validate.outputs.version }}
                  path: release-notes.md
                  retention-days: 90

    # ------------------------------------------------------------------ #
    # DEPLOY — production only, after the production QA stage passes.
    # ------------------------------------------------------------------ #
    deploy:
        name: Deploy to production VPS
        runs-on: ubuntu-latest
        needs: [stage, validate, production]
        if: needs.stage.outputs.stage == 'production' && needs.production.result == 'success'
        env:
            VERSION_TAG: ${{ needs.stage.outputs.version }}
            VERSION: ${{ needs.validate.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download release notes
              uses: actions/download-artifact@v4
              with:
                  name: release-notes-${{ needs.validate.outputs.version }}
                  path: ./

            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: 22
                  envs: VERSION_TAG,VERSION
                  script: |
                      set -euo pipefail
                      cd "$HOME/apps/internara"
                      echo "==> Deploying version: $VERSION (tag: $VERSION_TAG)"

                      # Backup current deployment before changes
                      echo "==> Creating backup"
                      bash .github/scripts/backup.sh

                      # Checkout and reset to the version tag
                      echo "==> Checking out version tag"
                      git fetch --quiet origin --tags
                      git checkout --quiet "$VERSION_TAG"
                      git reset --hard --quiet "$VERSION_TAG"
                      echo "==> Checked out $VERSION_TAG"

                      # Run deployment
                      VERSION_TAG="$VERSION_TAG" bash .github/scripts/deploy.sh

            - name: Notify deployment success
              if: success()
              run: |
                  echo "✓ Successfully deployed v${{ needs.validate.outputs.version }} to production"

            - name: Notify deployment failure
              if: failure()
              run: |
                  echo "::error::Deployment failed for v${{ needs.validate.outputs.version }}"
                  echo "Run rollback: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd $HOME/apps/internara && bash .github/scripts/rollback.sh'"
